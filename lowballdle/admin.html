<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Lowballdle admin</title>
<link rel="icon" type="image/png" href="https://dinotimbs.com/favicon.png">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; scrollbar-width: none; }
  *::-webkit-scrollbar { display: none; }
  body { margin: 0 auto; max-width: 820px; padding: 0 16px 60px; font: 14px/1.4 system-ui, sans-serif; background: #111; color: #ddd; }
  header { position: sticky; top: 0; z-index: 1; background: #111; padding: 12px 0 8px; border-bottom: 1px solid #333; }
  .bar { display: flex; gap: 12px; align-items: baseline; }
  .logo { display: none; }
  h1 { font-size: 14px; margin: 0; }
  nav { display: flex; gap: 4px; margin-top: 8px; overflow-x: auto; }
  nav button[aria-selected="true"] { font-weight: 700; }
  section[hidden] { display: none; }
  h2 { font-size: 14px; margin: 16px 0 2px; }
  .hint, small, .date, label, .tag, .queue, .group p { color: #888; }
  .hint { margin: 0 0 8px; }
  .queue { margin-left: auto; }
  .queue.warn, .empty.soon .what b, .err, .actions .danger, .pill.down, .x:hover { color: #f66; }
  .tag.live, .saved, .pill.up, .pill.win { color: #6c6; }
  .note { color: #db5; margin: 0; }
  .err { margin: 0; }
  .day { display: flex; gap: 10px; align-items: center; width: 100%; padding: 6px 0; border: 0; border-bottom: 1px solid #222; background: none; text-align: left; cursor: pointer; }
  .date { width: 90px; flex: none; }
  .date b { margin-right: 4px; }
  .empty .what b { color: #888; }
  .thumb { width: 32px; height: 32px; flex: none; background: #222 center / cover; display: grid; place-items: center; }
  .what { flex: 1; min-width: 0; }
  .what b { display: block; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  dialog { width: min(520px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); border: 1px solid #333; background: #111; color: #ddd; }
  form.edit, .tester { display: grid; gap: 10px; }
  form.edit h2 { margin: 0; }
  label { display: grid; gap: 2px; font-size: 12px; }
  input, textarea, select { width: 100%; font: inherit; }
  textarea { min-height: 70px; }
  .money { display: flex; align-items: center; gap: 4px; }
  .money::before { content: '$'; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .photo-pick { position: relative; aspect-ratio: 16 / 10; border: 1px dashed #444; background: #000 center / contain no-repeat; display: grid; place-items: center; }
  .photo-pick.has span { display: none; }
  .photo-pick input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .actions { display: flex; gap: 8px; }
  .actions .danger { margin-right: auto; }
  .group { border-top: 1px solid #222; padding: 8px 0; }
  .group h3 { font-size: 13px; margin: 0; }
  .group p { margin: 0 0 6px; font-size: 12px; }
  .row { display: grid; grid-template-columns: 44px 1fr auto auto; gap: 4px; align-items: center; }
  .row.price { grid-template-columns: 90px 44px 1fr auto auto; }
  .row.off input:not([type=checkbox]) { opacity: .4; }
  .row input[type=checkbox] { width: auto; }
  .emoji { text-align: center; }
  .emoji::placeholder { opacity: .25; }
  .x, .add { background: none; border: 0; color: #888; cursor: pointer; padding: 2px 4px; }
  .saved { font-size: 12px; min-height: 14px; }
  .result { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  @media (max-width: 560px) { .two { grid-template-columns: 1fr; } .row.price { grid-template-columns: 70px 40px 1fr auto auto; } }
</style>
</head>
<body>
<header>
  <div class="bar"><h1>Lowballdle admin</h1><span class="queue" id="queue"></span></div>
  <nav role="tablist">
    <button role="tab" data-tab="listings" aria-selected="true">Listings</button>
    <button role="tab" data-tab="lines">Seller lines</button>
    <button role="tab" data-tab="prices">Price replies</button>
    <button role="tab" data-tab="tester">Test an offer</button>
  </nav>
</header>

<main>
  <section id="listings">
    <div class="card"><h2>Queued</h2><div id="upcoming"></div></div>
    <div class="card"><h2>Past</h2><div id="past"></div></div>
  </section>

  <section id="lines" hidden>
    <div class="card"><h2>Seller lines</h2><div id="lineGroups"></div></div>
  </section>

  <section id="prices" hidden>
    <div class="card">
      <h2>Price replies</h2>
      <div class="group"><div id="priceRows"></div><button class="add" id="addPrice">+ Add price reply</button></div>
    </div>
  </section>

  <section id="tester" hidden>
    <div class="card">
      <h2>Try an offer</h2>
      <form class="tester" id="testForm">
        <div class="two">
          <label>Listing price<span class="money"><input id="tPrice" inputmode="decimal" required placeholder="75"></span></label>
          <label>Offer<span class="money"><input id="tOffer" inputmode="decimal" required placeholder="20"></span></label>
        </div>
        <label>Win margin (optional)<span class="money"><input id="tTol" inputmode="decimal" placeholder="auto: 5% or $1"></span></label>
        <div class="actions"><button class="btn">Send offer</button></div>
        <div class="result" id="tResult"></div>
      </form>
    </div>
  </section>
</main>

<dialog id="editor">
  <form class="edit" id="itemForm" method="dialog">
    <h2 id="edTitle">New listing</h2>
    <label class="photo-pick" id="photoPick"><span>Add a photo</span><input type="file" accept="image/*" id="photoInput" aria-label="Photo"></label>
    <div class="two">
      <label>Day<input type="date" name="day" required></label>
      <label>Price<span class="money"><input name="price" inputmode="decimal" required placeholder="75"></span></label>
    </div>
    <label>Title<input name="title" required maxlength="200" placeholder="Spongebob Boombox"></label>
    <div class="two">
      <label>Condition<input name="condition" list="conditions" maxlength="100" placeholder="Used - Good"></label>
      <label>Location<input name="location" maxlength="100" placeholder="Utah"></label>
    </div>
    <datalist id="conditions"><option>New</option><option>Used - Like new</option><option>Used - Good</option><option>Used - Fair</option></datalist>
    <label>Description<textarea name="description" maxlength="2000" placeholder="I know what I got"></textarea></label>
    <div class="two">
      <label>Seller name<input name="seller_name" maxlength="100" placeholder="John Marketplace"></label>
      <label>Seller joined<input name="seller_joined" maxlength="100" placeholder="Joined in 2011"></label>
    </div>
    <div class="two">
      <label>Listed<input name="listed_ago" maxlength="100" placeholder="5 days ago"></label>
      <label>Win margin (optional)<span class="money"><input name="tolerance" inputmode="decimal" placeholder="auto: 5% or $1"></span></label>
    </div>
    <p class="note" id="edNote" hidden></p>
    <p class="err" id="edErr" hidden></p>
    <div class="actions">
      <button type="button" class="btn danger" id="edDelete" hidden>Delete</button>
      <button type="button" class="btn soft" id="edCancel">Cancel</button>
      <button type="submit" class="btn" id="edSave" value="save">Save</button>
    </div>
  </form>
</dialog>

<script>
const $ = id => document.getElementById(id);
const el = (tag, props = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) k.includes('-') ? n.setAttribute(k, v) : (n[k] = v);
  n.append(...kids);
  return n;
};
const fmt = c => '$' + (c / 100).toLocaleString('en-US', { minimumFractionDigits: c % 100 ? 2 : 0, maximumFractionDigits: 2 });
const toCents = v => { const n = parseFloat(String(v).replace(/[^\d.]/g, '')); return Number.isFinite(n) ? Math.round(n * 100) : NaN; };
const plusDays = (day, n) => new Date(Date.parse(day + 'T12:00:00Z') + n * 864e5).toISOString().slice(0, 10);
const label = day => new Date(day + 'T12:00:00Z').toLocaleDateString('en-US', { timeZone: 'UTC', weekday: 'short', month: 'short', day: 'numeric' });

async function api(method, path, body) {
  const res = await fetch(path, { method, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body && JSON.stringify(body) });
  const d = await res.json().catch(() => ({ error: `Server said ${res.status}` }));
  if (d.error) throw new Error(d.error);
  return d;
}

// tabs
const loaded = {};
document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => {
  document.querySelectorAll('[data-tab]').forEach(o => o.setAttribute('aria-selected', o === b));
  document.querySelectorAll('main > section').forEach(s => { s.hidden = s.id !== b.dataset.tab; });
  if (!loaded[b.dataset.tab]) { loaded[b.dataset.tab] = true; ({ lines: loadLines, prices: loadPrices })[b.dataset.tab]?.(); }
  try { localStorage.setItem('adminTab', b.dataset.tab); } catch {}
});

// ---------- listings ----------
let today = '', itemsById = new Map();
async function loadItems() {
  const d = await api('GET', 'api/items');
  today = d.today;
  itemsById = new Map(d.items.map(i => [i.id, i]));
  const byDay = new Map(d.items.map(i => [i.day, i]));
  const days = new Set(Array.from({ length: 14 }, (_, i) => plusDays(today, i)));
  d.items.forEach(i => { if (i.day >= today) days.add(i.day); });
  const upcoming = [...days].sort();
  $('upcoming').replaceChildren(...upcoming.map(day => dayRow(day, byDay.get(day))));
  const past = d.items.filter(i => i.day < today).reverse();
  $('past').replaceChildren(...(past.length ? past.map(i => dayRow(i.day, i)) : [el('p', { className: 'hint', textContent: 'Nothing yet.' })]));
  const week = Array.from({ length: 7 }, (_, i) => plusDays(today, i)).filter(day => byDay.has(day)).length;
  $('queue').textContent = `${week}/7 days queued`;
  $('queue').classList.toggle('warn', week < 7);
}

function dayRow(day, item) {
  const soon = day < plusDays(today, 7);
  const b = el('button', { type: 'button', className: 'day' + (item ? '' : ' empty') + (soon ? ' soon' : '') },
    el('span', { className: 'date' }, el('b', { textContent: day === today ? 'Today' : label(day).split(', ')[0] }), label(day).split(', ').slice(1).join(', ')));
  const thumb = el('span', { className: 'thumb', textContent: item ? (item.has_photo ? '' : '📦') : '+' });
  if (item?.has_photo) thumb.style.backgroundImage = `url(photo/${item.id}?v=${Date.now()})`;
  const what = el('span', { className: 'what' }, el('b', { textContent: item ? item.title : 'Empty, add a listing' }));
  if (item) what.append(el('small', { textContent: fmt(item.price) + (item.players ? ` · ${item.players} played · ${item.wins} won` : '') }));
  b.append(thumb, what);
  if (day === today && item) b.append(el('span', { className: 'tag live', textContent: 'LIVE' }));
  b.onclick = () => item ? openItem(item.id) : openNew(day);
  return b;
}

let editing = null, photoData = null;
const form = $('itemForm');
function resetForm() {
  form.reset();
  photoData = null;
  $('photoPick').classList.remove('has');
  $('photoPick').style.backgroundImage = '';
  $('edErr').hidden = $('edNote').hidden = true;
}
function openNew(day) {
  resetForm();
  editing = null;
  $('edTitle').textContent = 'New listing';
  form.day.value = day;
  $('edDelete').hidden = true;
  $('editor').showModal();
}
async function openItem(id) {
  resetForm();
  const it = await api('GET', `api/items/${id}`);
  editing = it;
  $('edTitle').textContent = 'Edit listing';
  for (const k of ['day', 'title', 'condition', 'location', 'listed_ago', 'description', 'seller_name', 'seller_joined']) form[k].value = it[k] ?? '';
  form.price.value = it.price / 100;
  form.tolerance.value = it.tolerance == null ? '' : it.tolerance / 100;
  if (it.has_photo) { $('photoPick').classList.add('has'); $('photoPick').style.backgroundImage = `url(photo/${id}?v=${Date.now()})`; }
  const played = itemsById.get(id)?.players;
  $('edDelete').hidden = !!played;
  if (played) { $('edNote').hidden = false; $('edNote').textContent = `${played} people already played this one. Changing the price changes the game for anyone mid-round.`; }
  else if (it.day === today) { $('edNote').hidden = false; $('edNote').textContent = 'This listing is live right now.'; }
  $('editor').showModal();
}

async function shrink(file) {
  const img = await createImageBitmap(file);
  const k = Math.min(1, 1200 / Math.max(img.width, img.height));
  const c = el('canvas', { width: Math.round(img.width * k), height: Math.round(img.height * k) });
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.85);
}
$('photoInput').onchange = async e => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    photoData = await shrink(file);
    $('photoPick').classList.add('has');
    $('photoPick').style.backgroundImage = `url(${photoData})`;
  } catch { showErr('Couldn’t read that photo, try a JPEG or PNG'); }
};
function showErr(msg) { $('edErr').hidden = false; $('edErr').textContent = msg; }

form.onsubmit = async e => {
  e.preventDefault();
  const body = Object.fromEntries(new FormData(form));
  body.price = toCents(body.price);
  body.tolerance = body.tolerance === '' ? null : toCents(body.tolerance);
  if (!(body.price > 0)) return showErr('Price must be a number');
  if (editing) body.id = editing.id;
  if (photoData) body.photo = photoData;
  $('edSave').disabled = true;
  try {
    await api('POST', 'api/items', body);
    $('editor').close();
    await loadItems();
  } catch (err) { showErr(err.message); }
  finally { $('edSave').disabled = false; }
};
$('edCancel').onclick = () => $('editor').close();
$('edDelete').onclick = async () => {
  if (!editing || !confirm(`Delete “${editing.title}”?`)) return;
  try { await api('DELETE', `api/items/${editing.id}`); $('editor').close(); await loadItems(); } catch (err) { showErr(err.message); }
};

// ---------- seller lines ----------
const GROUPS = [
  ['up', 0, 'Too low · close', 'Offer is 85–95% of the price'], ['up', 1, 'Too low · off', '60–85% of the price'],
  ['up', 2, 'Too low · way off', '30–60% of the price'], ['up', 3, 'Too low · absurd', 'Under 30% of the price'],
  ['down', 0, 'Too high · close', 'Up to 115% of the price'], ['down', 1, 'Too high · off', '115–160% of the price'],
  ['down', 2, 'Too high · way off', '160–300% of the price'], ['down', 3, 'Too high · absurd', 'Over 3× the price'],
  ['deal', null, 'Deal', 'They won'], ['sold', null, 'Sold to someone else', 'They used all 6 offers. Must include {price}'],
];

function editableRow(rec, { endpoint, fields, onDelete }) {
  const row = el('div', { className: 'row' + (endpoint === 'price-lines' ? ' price' : '') + (rec.active === 0 ? ' off' : '') });
  const inputs = {};
  if (fields.includes('amount')) {
    inputs.amount = el('input', { inputMode: 'decimal', placeholder: '$100', value: rec.amount ? rec.amount / 100 : '', 'aria-label': 'Exact offer' });
    row.append(el('span', { className: 'money' }, inputs.amount));
  }
  inputs.emoji = el('input', { className: 'emoji', value: rec.emoji ?? '', placeholder: '🤔', maxLength: 20, 'aria-label': 'Reaction emoji' });
  inputs.text = el('input', { value: rec.text ?? '', placeholder: 'What the seller says', maxLength: 300, 'aria-label': 'Line' });
  const active = el('input', { type: 'checkbox', checked: rec.active !== 0, title: 'On', 'aria-label': 'Line is on' });
  const del = el('button', { type: 'button', className: 'x', textContent: '×', title: 'Delete', 'aria-label': 'Delete line' });
  row.append(inputs.emoji, inputs.text, active, del);
  const status = el('div', { className: 'saved' });
  async function save() {
    if (!inputs.text.value.trim()) return;
    const body = { ...rec, emoji: inputs.emoji.value, text: inputs.text.value, active: active.checked };
    if (inputs.amount) body.amount = toCents(inputs.amount.value);
    try {
      Object.assign(rec, await api('POST', `api/${endpoint}`, body));
      row.classList.toggle('off', !active.checked);
      status.textContent = 'Saved'; status.style.color = '';
      setTimeout(() => { status.textContent = ''; }, 1500);
    } catch (err) { status.textContent = err.message; status.style.color = 'var(--red)'; }
  }
  for (const i of [...Object.values(inputs)]) i.onchange = save;
  active.onchange = save;
  del.onclick = async () => {
    if (rec.id && !confirm('Delete this line?')) return;
    if (rec.id) await api('DELETE', `api/${endpoint}/${rec.id}`);
    wrap.remove();
    onDelete?.();
  };
  const wrap = el('div', {}, row, status);
  return wrap;
}

async function loadLines() {
  const lines = await api('GET', 'api/lines');
  $('lineGroups').replaceChildren(...GROUPS.map(([kind, tier, title, hint]) => {
    const list = el('div');
    const mine = lines.filter(l => l.kind === kind && l.tier === tier);
    const make = rec => editableRow(rec, { endpoint: 'lines', fields: ['emoji', 'text'] });
    list.append(...mine.map(make));
    const add = el('button', { type: 'button', className: 'add', textContent: '+ Add line' });
    add.onclick = () => {
      const r = make({ kind, tier, emoji: mine[0]?.emoji ?? '', text: '' });
      list.append(r);
      r.querySelector('input:not(.emoji)').focus();
    };
    return el('div', { className: 'group' }, el('h3', { textContent: title }), el('p', { textContent: hint }), list, add);
  }));
}

async function loadPrices() {
  const rows = await api('GET', 'api/price-lines');
  const make = rec => editableRow(rec, { endpoint: 'price-lines', fields: ['amount', 'emoji', 'text'] });
  $('priceRows').replaceChildren(...rows.map(make));
  $('addPrice').onclick = () => { const r = make({ text: '' }); $('priceRows').append(r); r.querySelector('input').focus(); };
}

// ---------- tester ----------
$('testForm').onsubmit = async e => {
  e.preventDefault();
  try {
    const r = await api('POST', 'api/test', { price: toCents($('tPrice').value), amount: toCents($('tOffer').value), tolerance: $('tTol').value ? toCents($('tTol').value) : null });
    const names = ['close', 'off', 'way off', 'absurd'];
    const pill = r.verdict === 'win' ? 'WIN' : `${r.verdict === 'up' ? '▲ HIGHER' : '▼ LOWER'} · ${names[r.tier]}`;
    $('tResult').replaceChildren(el('span', { className: 'bubble', textContent: r.line }), el('span', { textContent: r.emoji || '' }),
      el('span', { className: 'pill ' + r.verdict, textContent: pill + (r.special ? ' · price reply' : '') }));
  } catch (err) { $('tResult').replaceChildren(el('p', { className: 'err', textContent: err.message })); }
};

loadItems().catch(err => { $('upcoming').replaceChildren(el('p', { className: 'hint', textContent: err.message })); });
try { const t = localStorage.getItem('adminTab'); if (t && t !== 'listings') document.querySelector(`[data-tab="${t}"]`)?.click(); } catch {}
</script>
</body>
</html>
