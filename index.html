  <style>
    @font-face { font-family: 'Doto'; src: url(larpdle/fonts/doto-latin-900-normal.woff2) format('woff2'); font-weight: 900; font-display: swap; }
    @font-face { font-family: 'DSEG7'; src: url(larpdle/fonts/DSEG7Classic-Bold.woff2) format('woff2'); font-display: swap; }
    @font-face { font-family: 'Inter'; src: url(larpdle/fonts/inter-latin-700-normal.woff2) format('woff2'); font-weight: 700; font-display: swap; }
    :root { --ink: #1f2719; --lcd: #a3ae8f; }
    .games { position: fixed; inset: 0; z-index: 1; display: flex; align-items: center; justify-content: center; padding: 16px; pointer-events: none; }
    .games .lcd { pointer-events: auto; width: min(440px, 100%); padding: 12px; border-radius: 14px; background: #0f1317; box-shadow: 0 30px 70px rgba(0, 0, 0, 0.75); }
    .lcd-head, .games ol { background: var(--lcd); color: var(--ink); }
    .lcd-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-radius: 6px 6px 0 0; border-bottom: 2px solid var(--ink); font-family: Inter, sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 0.12em; }
    .lcd-head h1 { margin: 0; font-family: Doto, monospace; font-weight: 900; font-size: 24px; letter-spacing: 0.04em; -webkit-text-stroke: 0.4px currentColor; }
    .games ol { list-style: none; margin: 0; padding: 0; border-radius: 0 0 6px 6px; overflow: hidden; background-image: radial-gradient(circle, rgba(31, 39, 25, 0.1) 1px, transparent 1.3px); background-size: 5px 5px; }
    .games li + li { border-top: 2px solid var(--ink); }
    .games a { display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 12px 14px; color: var(--ink); text-decoration: none; }
    .games a:hover, .games a:focus-visible { background: var(--ink); color: var(--lcd); outline: none; }
    .num { font-family: DSEG7, monospace; font-size: 26px; }
    .name { flex: 1; display: flex; flex-direction: column; gap: 4px; font-family: Doto, monospace; font-weight: 900; font-size: 30px; line-height: 1; -webkit-text-stroke: 0.4px currentColor; }
    .name small { font-family: Inter, sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 0.12em; -webkit-text-stroke: 0; }
    .go { font-size: 18px; }
    @media (prefers-reduced-motion: reduce) { .scroller-content { animation: none !important; } }
    body {
      background-color: black;
      background-size: contain;
      background-position: center;
      background-attachment: fixed;
      margin: 0;
      padding: 0;
    }
    .scroller {
      overflow: hidden;
      position: relative;
    }
    .scroller-content {
      display: flex;
    }
    .scroller-content img {
      object-fit: cover;
      flex-shrink: 0;
    }
    @media (min-width: 601px) {
      .scroller {
        height: 100vh;
        width: 100vw;
      }
      .scroller-content {
        flex-direction: row;
        animation: scroll 100s linear infinite;
        animation-direction: alternate-reverse;
      }
      .scroller-content img {
        height: 100vh;
      }
      @keyframes scroll {
        0% {
          transform: translateX(0);
        }
        100% {
          transform: translateX(-500%);
        }
      }
    }

    @media (max-width: 600px) {
      .scroller {
        width: 100vw;
        height: 100vh;
      }
      .scroller-content {
        flex-direction: column;
        animation: scroll 10s linear infinite;
        animation-direction: alternate-reverse;
      }
      .scroller-content img {
        width: 100vw;
      }
      @keyframes scroll {
        0% {
          transform: translateY(0);
        }
        100% {
          transform: translateY(-25%);
        }
      }
    }
  </style>
</body>
